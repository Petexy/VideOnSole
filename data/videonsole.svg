<svg data-lxb-material="lxb:shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Videonsole: a strip of film with a play mark cut through it.

    Drawn in the shell's own glyph language rather than as a badge with a
    background — the same 32-unit field, the same bead-and-holes construction,
    and the same one colour. See LineXinBar's glyph sources, where the language
    is set out: a glyph is one white body, and everything inside it is an
    opening cut through that body rather than a mark laid on top.

    The strip and its sprockets are the toolkit's own `category-video`, to the
    unit, so this application's mark stands in the same family as the shelf it
    is reached from. What tells the two apart is what is cut through the middle:
    the category has two empty frames and this has the play mark, because a
    category is a kind of file and an application is something that does
    something to one.
  -->
  <defs>
    <rect id="strip" x="2.4" y="6.6" width="27.2" height="18.8" rx="1.8"/>

    <g id="sprockets">
      <rect x="4.9" y="8.2" width="2.4" height="2.2" rx="0.7"/>
      <rect x="9.9" y="8.2" width="2.4" height="2.2" rx="0.7"/>
      <rect x="14.8" y="8.2" width="2.4" height="2.2" rx="0.7"/>
      <rect x="19.7" y="8.2" width="2.4" height="2.2" rx="0.7"/>
      <rect x="24.7" y="8.2" width="2.4" height="2.2" rx="0.7"/>
      <rect x="4.9" y="21.6" width="2.4" height="2.2" rx="0.7"/>
      <rect x="9.9" y="21.6" width="2.4" height="2.2" rx="0.7"/>
      <rect x="14.8" y="21.6" width="2.4" height="2.2" rx="0.7"/>
      <rect x="19.7" y="21.6" width="2.4" height="2.2" rx="0.7"/>
      <rect x="24.7" y="21.6" width="2.4" height="2.2" rx="0.7"/>
    </g>

    <!-- What is cut through the middle. Stroked as well as filled, with a
         round join, so the mark is a bead of the same weight as the rest of
         the language rather than a sharp-cornered arrowhead. -->
    <path id="play" d="M12.6 12.3L19.6 16L12.6 19.7Z"
          stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

    <g id="bead"><use href="#strip"/></g>
    <g id="holes">
      <use href="#sprockets"/>
      <use href="#play" fill="#000000" stroke="#000000"/>
    </g>

    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
